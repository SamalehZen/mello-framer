name: CodeQL

# Static analysis (SAST) of the application code. Dependabot looks after the
# dependencies; CodeQL looks after what we actually wrote. Results land in the
# repository's Security tab.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published queries catch latent issues in unchanged code.
    - cron: '0 6 * * 3'

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # JavaScript/TypeScript is extracted without a build step.
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
