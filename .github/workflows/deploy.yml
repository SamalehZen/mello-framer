name: Deploy to GitHub Pages

# Publishing is gated on the CI workflow: nothing reaches the live site unless
# typecheck, lint, format, build, unit tests and e2e all passed for that exact
# commit. `workflow_dispatch` stays available for a manual redeploy.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; never cancel a running one so the published
# site always reflects a complete build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # A failed or cancelled CI run must never publish.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Deploy the commit CI validated, not whatever `main` points to by now.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The app is served from a project sub-path (https://<user>.github.io/<repo>/),
      # so Vite must emit assets relative to that base. `BASE` is read by
      # vite.config.ts and `%BASE_URL%` in index.html follows it.
      - name: Build
        run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}/
          # Optional: set the repository variable to enable error reporting.
          VITE_REPORT_ENDPOINT: ${{ vars.VITE_REPORT_ENDPOINT }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
